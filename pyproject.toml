[project]
name = "D17Ocalib-paper"
version = "0.1.0"
description = "Full dataset and codebase for “Triple oxygen isotope equilibrium between calcite and water: new constraints over 8–200 °C and their metrological implications”, by Daëron et al."
readme = "readme.md"
requires-python = ">=3.14"
dependencies = [
    "lmfit>=1.3.4",
    "matplotlib>=3.11.1",
    "pandas>=3.0.5",
    "rich>=15.0.0",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.0",
    "toml>=0.10.2",
    "tomli-w>=1.2.0",
]
